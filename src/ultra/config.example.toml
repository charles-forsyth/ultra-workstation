# Ultra AI Workstation Desktop configuration.
# Copy to ~/.config/ultra-workstation/config.toml (`ultra config init` does this).
# Every value here is a placeholder. Real addresses and ids live only in your copy.

[operator]
name = "Ada Example"
addresses = ["ada@example.org"]        # every address that counts as "from me"
timezone = "America/New_York"
ledger_id = ""                         # your id in the ledger (nexus), if used
slack_user_id = ""

[server]
port = 7440
# With --host 0.0.0.0, only these clients may connect (this machine always can).
# "tailnet:mine" = devices owned by your own Tailscale user (not the whole 100.64/10).
# remote_networks = ["192.168.0.0/16", "tailnet:mine"]
poll_mail_seconds = 120
poll_slack_minutes = 15

[google]
oauth_client = "~/.config/ultra-workstation/oauth_client.json"
token_read = "~/.config/ultra-workstation/tokens/read.json"
token_modify = "~/.config/ultra-workstation/tokens/modify.json"
token_send = "~/.config/ultra-workstation/tokens/send.json"
token_calendar = "~/.config/ultra-workstation/tokens/calendar.json"
calendars = ["primary"]
work_block_color = "tomato"
personal_block_visibility = "private"

[ui]
# Layout (v1.6): "calm" (three places, menus, one status dot) or "classic" (every
# button on screen, the pre-1.5 layout; both stay). Each browser can switch
# for itself from the status dot menu or the palette.
layout = "calm"

[ledger]
enabled = true
binary = "nexus"
my_id = ""                         # your own ledger id (e.g. NetID); left off link chips
tasks_in_stream = true             # show open ledger tasks in the stream (Tasks filter)
org_email_domain = "example.org"
netid_from_local_part = true
max_parallel = 3
use_serve = true                   # use `nexus serve` (warm, fast) when it is running
# serve_url = "http://127.0.0.1:7450"          # loopback only
# serve_token_file = "~/.config/nexus/serve.token"
# backend = "cli"                  # "mcp" (hosted ledger MCP server, [mcp.nexus]),
#                                    "serve" or "cli". mcp falls back to serve/CLI for
#                                    reads only when the server cannot be reached.

# Hosted MCP servers (v1.3). Each is a pre-registered program client on that server:
# set the URL and client id the server's admin gave you, then run `ultra auth nexus`
# / `ultra auth ursa` once. Tokens go to tokens/mcp-<name>.json (mode 600).
# [mcp.nexus]
# url = "https://ledger-mcp.example.org/mcp"
# client_id = "ledger-ultra"
# parallel = 8                     # calls in flight (server cap is 16)
# per_min = 500                    # client-side budget, below the server's limit
# [mcp.ursa]
# url = "https://cluster-mcp.example.org/mcp"
# client_id = "cluster-ultra"
# parallel = 2
# per_min = 100

[slack]
enabled = false
claude_binary = "claude"
claude_cwd = "~"
tool_prefix = "mcp__claude_ai_Slack__"

[tickets]
sender_patterns = ['@service-now\.com$']
number_patterns = ['RITM\d{7}', 'INC\d{7}', 'SCTASK\d{7}', 'REQ\d{7}']
ref_pattern = 'Ref:MSG\d{6,12}'   # reference line replies to the desk must carry (last line)

[mail]
vip_file = "~/.config/ultra-workstation/vip.txt"
noise_patterns = ['noreply', 'no-reply', 'newsletter', 'notification']
send_delay_seconds = 15
include_sent = false               # true: also show recent Sent threads you archived
sent_lookback_days = 14            # used only when include_sent = true
self_cc = false

[court]
waiting_amber_days = 3
waiting_red_days = 5
done_signal_patterns = ['\bis ready\b', '\bcompleted\b', '\ball set\b', '\bdone\b']

[ai]
provider = "gemini"                    # or "none"
model = ""
fallback_model = ""
hide_ticket_prefix = ""                 # e.g. "INT-": the briefing never repeats these keys

[draft]
# Draft Studio (SPEC 9.6). Policy pages the drafts may cite; the real list is private.
# kinds: "site" (pages found through its sitemap.xml), "page" (one URL),
#        "servicenow_kb" (public articles through the portal page API)
sources = [
  # { kind = "site", url = "https://it.example.edu" },
  # { kind = "page", url = "https://it.example.edu/ai" },
]
notes_dir = ""                          # dated work notes (YYYY-MM-DD_*.md) to search by name
generic_words = []                      # workplace filler to ignore when matching topics

[audio]
tts_model = ""
voices = ["Charon", "Kore", "Puck", "Aoede", "Fenrir", "Leda", "Orus", "Zephyr"]
default_voice = "Charon"
price_in_per_1m = 0.0
price_out_per_1m = 0.0
chunk_chars = 3500

[hermes]
# Ask Hermes: read-only questions to your own Hermes Agent about what is on screen.
enabled = true
binary = "hermes"
toolsets = ["session_search"]          # read-only; the only choice today (web is per question)
allow_web = true                       # shows the per-question "Allow web" tick
source = "ultra"                       # session tag in your Hermes session list
# profile = "ultra-ask"                # v1.9: a Hermes profile whose nexus/ursa MCP servers
#                                      # are limited to read tools (tools.include); Ask can
#                                      # then look things up itself. Checked before each use.
max_turns = 25
budget_seconds = 300

# [vault]
# v1.10 Home: your personal notes vault (Obsidian markdown), read only. Ultra starts a
# local MCP server over it (headless-obsidian-mcp: clone, `npm install && npm run build`)
# with OBSIDIAN_TOOLS=reads, and shows dated todos on Today, palette search, a note reader.
# path = "~/Notes"
# name = "Notes"                       # Obsidian vault name, for "Open in Obsidian" links
# command = "node"
# args = ["~/src/headless-obsidian-mcp/dist/index.js"]
# exclude = ["_archive", "Templates"]  # folders hidden from the Home line and search

[research]
enabled = true
binary = "deep-research"
dashboard_url = ""
default_depth = 1
default_breadth = 3
